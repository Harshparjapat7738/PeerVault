server:
  port: 8081

spring:
  data:
    mongodb:
      database: auth_db

peervault:
  auth:
    # POST /api/v1/auth/login throttle, keyed per email: login-rate-limit-count attempts per
    # login-rate-limit-window-seconds — same fixed-window-counter shape as share-service's
    # POST /api/v1/share/request limiter. Without this, login had no brute-force protection at all.
    login-rate-limit-count: 10
    login-rate-limit-window-seconds: 300
