# Global defaults layered under every service's own {service-name}.yml (native backend, lowest priority
# after Vault secrets). Anything here can be overridden per-service.

eureka:
  client:
    service-url:
      # Same EUREKA_URI-overrides-else-built-from-host/port pattern as config-server's own bootstrap
      # file — lets a Render Blueprint wire this via fromService's separate host/port properties
      # instead of a pre-assembled URL string.
      defaultZone: ${EUREKA_URI:http://${EUREKA_HOST:eureka-server}:${EUREKA_PORT:8761}/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    # SASL_SSL support for an external managed Kafka (e.g. Aiven) in a real deployment — every one of
    # these defaults to PLAINTEXT/empty, which the Kafka client simply ignores when security.protocol
    # stays PLAINTEXT, so local docker-compose Kafka (no auth) is completely unaffected by these existing.
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      # Aiven (and most managed Kafka) signs its broker cert with a private CA the JVM doesn't trust
      # by default — SASL_SSL still needs this for the TLS handshake even though auth itself is via
      # sasl.jaas.config above, not a client certificate. ssl.truststore.type=PEM + .certificates lets
      # the CA be pasted as a plain env var (Kafka 2.7+/KIP-651) instead of mounting a .jks file, which
      # Render's Docker services have no easy way to do.
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:}
      ssl.truststore.certificates: ${KAFKA_SSL_CA_CERT:}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.peervault.common.event,com.peervault.common.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # add.type.headers stays at its default (true): every event class lives in `common`, which is on
      # every service's classpath, so the __TypeId__ header lets JsonDeserializer reconstruct the exact
      # record type (DomainEvent / TransferProgressEvent / DeviceFreezeCommand / AuditEventDto) with zero
      # per-listener default-type wiring.
  data:
    redis:
      # REDIS_URL (e.g. Render's managed Redis "rediss://:<password>@<host>:<port>") takes over
      # host/port/ssl/password entirely when set — Spring Boot's RedisConnectionConfiguration only
      # consumes it when non-blank, so leaving it unset (local docker-compose) falls through to the
      # plain host/port below exactly as before.
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
    mongodb:
      # Full Atlas SRV connection string, sourced from backend/.env (MONGODB_URI) — never hardcoded here
      # or in Vault. Each service overrides `database` in its own {service-name}.yml to pick its own
      # logical database within the one Atlas cluster (data ownership without separate clusters).
      uri: ${MONGODB_URI}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # "never", not "always": /actuator/** is on JwtAuthGlobalFilter's PUBLIC_PREFIXES allow-list
      # (container orchestrators need it reachable with no token), so with the gateway's public port
      # exposed to the internet, per-indicator health details (Mongo/Redis/Kafka connectivity,
      # component-level status) would otherwise be visible to anyone, unauthenticated. The aggregate
      # UP/DOWN status itself is unaffected — only the breakdown is hidden.
      show-details: never
  health:
    redis:
      enabled: true

jwt:
  access-ttl-seconds: 900
  refresh-ttl-seconds: 604800

peervault:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  security:
    delete-rate-limit-count: 20
    delete-rate-limit-window-seconds: 60
  trash:
    retention-days: 30

logging:
  level:
    com.peervault: INFO
    org.springframework.cloud: WARN
