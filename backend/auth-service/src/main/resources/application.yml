spring:
  application:
    name: auth-service
  config:
    # CONFIG_SERVER_URI overrides the whole URL when set (local/manual); otherwise built from
    # CONFIG_SERVER_HOST/CONFIG_SERVER_PORT, since a Render Blueprint's fromService can only hand
    # back separate host/port values, not a pre-assembled URL string.
    import: "configserver:${CONFIG_SERVER_URI:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}}"
  cloud:
    config:
      # Config Server's composite backend includes a Vault entry, which requires every client request
      # to carry an X-Config-Token header — Spring Cloud Config's client sends it automatically once
      # this is set. Same dev token vault-init.sh/native seeding uses.
      token: ${VAULT_TOKEN:peervault-dev-root-token}
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 2000
        # Spring Retry's exponential backoff asserts max > initial; left unset this defaults to 2000,
        # equal to initial-interval above, and fails fast at boot with "Max interval should be > than
        # initial interval" before ever attempting a retry.
        max-interval: 6000
