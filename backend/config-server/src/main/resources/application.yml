server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # Required for the composite list below to actually take effect — without it, Spring Cloud Config's
    # auto-configuration still wires up a default git-backed repository alongside (and ahead of) the
    # composite one, which then fails at startup demanding a git URI nobody configured. See
    # https://docs.spring.io/spring-cloud-config/reference/server/environment-repository/composite-repositories.html
    active: composite
  cloud:
    config:
      server:
        composite:
          - type: vault
            host: ${VAULT_HOST:localhost}
            port: ${VAULT_PORT:8200}
            scheme: ${VAULT_SCHEME:http}
            authentication: TOKEN
            token: ${VAULT_TOKEN:peervault-dev-root-token}
            kv-version: 2
            backend: secret
            default-key: application
          - type: native
            search-locations: ${CONFIG_REPO_LOCATION:file:../config-repo}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
