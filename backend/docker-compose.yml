name: peervault

x-common-env: &common-env
  CONFIG_SERVER_URI: http://config-server:8888
  EUREKA_URI: http://eureka-server:8761/eureka/
  KAFKA_BOOTSTRAP: kafka:9092
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Defaults to the bundled local `mongo` container below so `docker compose up` works with zero
  # external accounts. docker compose reads backend/.env automatically (same directory as this file)
  # and substitutes it here — drop a real MongoDB Atlas SRV string in there as MONGODB_URI to point at
  # the cloud instead (see backend/.env.example); config-repo/application.yml then references it as
  # spring.data.mongodb.uri: ${MONGODB_URI}.
  MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
  # Same backend/.env override as MONGODB_URI above. Set this to "http://<LAN-IP>:3000" when testing
  # cross-device (e.g. QR pairing scanned from a phone on the same Wi-Fi) - the gateway's CORS check
  # compares it against the browser's actual Origin header, so a frontend opened from a LAN IP
  # rather than "localhost" needs it to match or every request gets CORS-rejected. See
  # frontend/README.md's "Cross-device / LAN setup" section.
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}

services:

  # ─────────────────────────────── Infrastructure ───────────────────────────────

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "cGVlcnZhdWx0LWtSYWZ0LTE="
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: peervault-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault-init:
    image: hashicorp/vault:1.17
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./docker/vault-init.sh:/vault-init.sh:ro
    entrypoint: ["sh", "/vault-init.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: peervault-dev-root-token

  # ─────────────────────────────── Discovery & Config ───────────────────────────────

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8761' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    environment:
      <<: *common-env
      VAULT_HOST: vault
      VAULT_PORT: "8200"
      VAULT_SCHEME: http
      VAULT_TOKEN: peervault-dev-root-token
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on:
      eureka-server:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ─────────────────────────────── Gateway ───────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment: *common-env
    depends_on:
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Deliberately the one service bound to 0.0.0.0 (all interfaces) — it's the single intended
    # public entry point (JWT auth filter, CORS, WebSocket proxy). Every other port in this file is
    # now 127.0.0.1-only; see the note above "Business services" for why.
    ports:
      - "8080:8080"

  # ─────────────────────────────── Business services ───────────────────────────────
  #
  # SECURITY: every port below is bound to 127.0.0.1 (loopback) only, not 0.0.0.0 — `docker compose ps`
  # / `curl localhost:808x` still works for local debugging from the host machine (README's own
  # walkthrough), but on a real deployment host (e.g. a cloud VM with a public IP) these are no longer
  # reachable from outside that machine at all. This matters because every one of these services trusts
  # the `X-User-Id`/`X-User-Email` headers api-gateway's JwtAuthGlobalFilter forwards after verifying the
  # JWT — none of them re-verify the token themselves. Before this fix, publishing "8081:8081" etc. (bind
  # to all interfaces, the compose default) meant anyone on the network could hit auth-service/
  # device-service/file-service/... directly, skip the gateway's JWT check entirely, and forge any
  # `X-User-Id` header they liked. Same reasoning applies to the infrastructure ports above (mongo/redis/
  # kafka/vault/eureka/config-server) — none of those have their own auth either.

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment: *common-env
    depends_on:
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Now also backs the login rate limiter (spring-boot-starter-data-redis, added in this pass).
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"

  device-service:
    build:
      context: .
      dockerfile: device-service/Dockerfile
    environment: *common-env
    depends_on:
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"

  file-service:
    build:
      context: .
      dockerfile: file-service/Dockerfile
    environment: *common-env
    depends_on:
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"

  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    environment: *common-env
    depends_on:
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8084"

  security-service:
    build:
      context: .
      dockerfile: security-service/Dockerfile
    environment: *common-env
    depends_on:
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8085"

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment: *common-env
    depends_on:
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8086:8086"

  share-service:
    build:
      context: .
      dockerfile: share-service/Dockerfile
    environment: *common-env
    depends_on:
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8087:8087"

volumes:
  mongodata:
