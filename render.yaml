      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: KAFKA_BOOTSTRAP
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        sync: false
      - key: KAFKA_SASL_JAAS_CONFIG
        sync: false
      - key: REDIS_URL
        sync: false

